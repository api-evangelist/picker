aid: picker
name: Picker
description: >-
  Picker (Picker Express) is a Latin American last-mile delivery orchestration
  platform that connects e-commerce and retail businesses with a network of
  200,000+ couriers across 10+ delivery companies. Its product suite includes an
  Orchestrator for routing across multiple fleets, automated delivery Flows,
  live shipment Tracking, Cash-on-delivery collection, private My Fleet
  management, Shield loss insurance, and Fast Deposits cash advances. Picker
  exposes a REST API plus e-commerce plugins (Shopify, WooCommerce, VTEX, Tienda
  Nube, Ordatic) so merchants can create bookings, calculate delivery costs, and
  track orders programmatically. The company operates across Mexico, Ecuador,
  Colombia, Peru, Chile, Uruguay, and Costa Rica and is backed by 500 Global.
