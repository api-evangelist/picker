components:
  schemas:
    Model_70:
      type: object
      properties:
        mobile:
          type: string
          description: Phone number that is being verified
        OTPCode:
          type: number
          description: OTP sent via SMS to the user
          minimum: 1000
          maximum: 9999
      required:
      - mobile
      - OTPCode
    Model_81:
      type: object
      properties:
        type:
          type: string
          description: Type of event to delete
      required:
      - type
    Model_68:
      type: object
      properties:
        products:
          $ref: '#/components/schemas/products'
          type: array
        categories:
          $ref: '#/components/schemas/products'
          type: array
      required:
      - products
      - categories
    Model_60:
      type: object
      properties:
        type:
          type: string
          enum:
          - PICKUP
          - DELIVERY
      required:
      - type
    products:
      type: array
      items:
        $ref: '#/components/schemas/Model_67'
    Model_61:
      type: object
      properties:
        type:
          type: string
          description: Type of event to subscribe to
        url:
          type: string
        header:
          type: string
      required:
      - type
      - url
    Model_67:
      type: object
      properties:
        id:
          type: string
        order:
          type: number
      required:
      - id
      - order
    Model_66:
      type: object
      properties:
        businessID:
          type: string
          description: UserID of the business
      required:
      - businessID
