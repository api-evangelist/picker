      responses:
        default:
          schema:
            type: string
          description: Successful
  /business/addBusiness:
    post:
      summary: Register a new business via Email
      operationId: postBusinessAddbusiness
      parameters:
      - type: string
        description: en/ar
        name: content-language
        in: header
        required: true
      - type: string
        x-format:
          email: true
        name: email
        in: formData
        required: true
      - type: string
        enum:
        - WEB
        - ANDROID
        - IOS
        name: deviceType
        in: formData
        required: true
      - type: string
        name: deviceToken
        in: formData
        required: false
      - type: string
        minLength: 5
        pattern: /^[0-9]+$/
        name: mobile
        in: formData
        required: true
      - type: string
        description: '+593'
        x-convert:
          trim: true
        name: countryCode
        in: formData
        required: true
      - type: string
        minLength: 2
        x-convert:
          trim: true
        name: companyName
        in: formData
        required: true
      - type: object
        description: image url
        required: false
        name: imageLogo
        in: formData
      - type: object
        description: image url
        required: false
        name: imageFront
        in: formData
      - type: string
        minLength: 2
        x-convert:
          trim: true
        name: fullAddress
        in: formData
        required: true
      - type: string
        x-convert:
          trim: true
        name: addressReference
        in: formData
        required: false
      - type: string
        x-convert:
          trim: true
        name: exterior
        in: formData
        required: false
      - type: string
        x-convert:
          trim: true
        name: interior
        in: formData
        required: false
      - type: string
        x-convert:
          trim: true
        name: zipCode
        in: formData
        required: false
      - type: string
        x-convert:
          trim: true
        name: country
        in: formData
        required: false
      - type: string
        x-convert:
          trim: true
        name: city
        in: formData
        required: false
      - type: number
        name: latitude
        in: formData
        required: false
      - type: number
        name: longitude
        in: formData
        required: false
      - type: array
        description: Categories that the business is part of. Just the ID
        maxItems: 3
        items:
          type: string
        collectionFormat: multi
        name: businessCategories
        in: formData
        required: false
      - type: array
        items:
          type: object
          properties:
            day:
              type: number
              minimum: 0
              maximum: 6
            open:
              type: string
            close:
              type: string
            isOpen:
              type: boolean
          required:
          - day
          - isOpen
          optional:
          - open
          - close
        collectionFormat: multi
        name: schedule
        in: formData
        required: false
      - type: array
        description: Tags to find the business
        items:
          type: string
        collectionFormat: multi
        name: tags
        in: formData
        required: false
      consumes:
      - application/x-www-form-urlencoded
      tags:
      - business
      responses:
        default:
          schema:
            type: string
          description: Successful
  /business/addProductDetail:
    post:
      summary: Add a new detail to a product
      operationId: postBusinessAddproductdetail
      parameters:
      - type: string
        description: en/ar
        name: content-language
        in: header
        required: true
      - type: string
        description: ID of the product this detail belongs to
        minLength: 24
        maxLength: 24
        name: productID
        in: formData
        required: true
      - type: string
        description: 'Type of detail: SIMPLE | MULTIPLE | TEXT'
        enum:
        - SIMPLE
        - MULTIPLE
        - TEXT
        name: type
        in: formData
        required: true
      - type: string
        description: ID of the option that is selected as default
        name: default
        in: formData
        required: false
      - type: boolean
        description: Indicates if the detail is obligatory
        name: isObligatory
        in: formData
        required: true
      - type: array
        description: Options to show to the customer
        items:
          type: string
        collectionFormat: multi
        name: options
        in: formData
        required: false
      - type: string
        description: Description of the detail
        name: text
        in: formData
      consumes:
      - application/x-www-form-urlencoded
      tags:
      - business
      responses:
        default:
          schema:
            type: string
          description: Successful
  /business/createBusinessForUser:
    post:
      summary: Create a business for a user and assign to it
      operationId: postBusinessCreatebusinessforuser
      parameters:
      - type: string
        description: en/ar
        name: content-language
        in: header
        required: true
      - type: string
        name: country
        in: formData
        required: true
      - type: string
        name: currency
        in: formData
        required: true
      - type: array
        description: Options for business
        items:
          type: string
        collectionFormat: multi
        name: options
        in: formData
        required: false
      - type: string
        name: storeType
        in: formData
        required: true
      consumes:
      - application/x-www-form-urlencoded
      tags:
      - business
      responses:
        default:
          schema:
            type: string
          description: Successful
  /business/createProduct:
    post:
      summary: Register a new product of a business
      operationId: postBusinessCreateproduct
      parameters:
      - type: string
        description: en/ar
        name: content-language
        in: header
        required: true
      - type: string
        minLength: 3
        x-convert:
          trim: true
        name: name
        in: formData
        required: true
      - type: object
        description: image url
        optional:
        - thumbnail
        - original
        name: image
        in: formData
        required: false
      - type: number
        name: timeToPrepare
        in: formData
        required: true
      - type: boolean
        name: isActive
        in: formData
        required: true
      - type: number
        name: price
        in: formData
        required: true
      - type: string
        name: description
        in: formData
        required: false
