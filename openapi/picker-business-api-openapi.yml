  /business/addCategoryToBusiness:
    put:
      summary: Adds a businessCategory to the business
      operationId: putBusinessAddcategorytobusiness
      parameters:
      - description: Bearer Token
        name: authorization
        in: header
        required: true
        schema:
          type: string
      - description: en/ar
        name: content-language
        in: header
        required: true
        schema:
          type: string
      tags:
      - Business
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                businessCategoryID:
                  type: string
                  maxLength: 24
                  minLength: 24
                  description: ID of the business category
              required:
              - businessCategoryID
  /business/changeProductStatus:
    put:
      summary: Change product status to active or inactive
      operationId: putBusinessChangeproductstatus
      parameters:
      - description: en/ar
        name: content-language
        in: header
        required: true
        schema:
          type: string
      tags:
      - Business
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                status:
                  type: string
                productID:
                  type: string
                  maxLength: 24
                  minLength: 24
                  description: ID of the product
              required:
              - status
              - productID
  /business/confirmInformation:
    put:
      summary: Fill information of the business after creation
      operationId: putBusinessConfirminformation
      parameters:
      - description: en/ar
        name: content-language
        in: header
        required: true
        schema:
          type: string
      tags:
      - Business
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                companyName:
                  type: string
                  minLength: 2
                imageLogo:
                  type: object
                  description: image url
                imageFront:
                  type: object
                  description: image url
                businessCategories:
                  type: array
                  items:
                    type: string
                  maxItems: 3
                  description: Categories that the business is part of. Just the ID
                productTypes:
                  type: array
                  items:
                    type: string
                  maxItems: 3
                  description: Product types that the business is part of. Just the ID
                fullAddress:
                  type: string
                  minLength: 2
                  description: Full address of the business' location.
                latitude:
                  type: number
                  description: Latitude of the business' location.
                longitude:
                  type: number
                  description: Longitude of the business' location.
                schedule:
                  type: array
                  items:
                    type: object
                    properties:
                      day:
                        type: number
                        minimum: 0
                        maximum: 6
                      open:
                        type: string
                        description: Hour the business opens HH:mm
                      close:
                        type: string
                        description: Hour the business closes HH:mm
                      isOpen:
                        type: boolean
                    required:
                    - day
                    - isOpen
                    optional:
                    - open
                    - close
                role:
                  type: string
              required:
              - companyName
              - fullAddress
              - latitude
              - longitude
              - schedule
              - role
  /business/editProduct:
    put:
      summary: Edits the information of a product
      operationId: putBusinessEditproduct
      parameters:
      - description: en/ar
        name: content-language
        in: header
        required: false
        schema:
          type: string
      tags:
      - Business
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                image:
                  type: object
                  description: image url
                timeToPrepare:
                  type: number
                isActive:
                  type: boolean
                price:
                  type: number
                description:
                  type: string
                category:
                  type: string
                  maxLength: 24
                  minLength: 24
                  description: ID of the category of the product
                _id:
                  type: string
                  maxLength: 24
                  minLength: 24
                  description: ID of the product
                details:
                  type: array
                  items:
                    type: string
                isDeleted:
                  type: boolean
                productType:
                  type: string
                  description: Type of product. Related to the categories that the business belongs to.
                commission:
                  type: number
                  maximum: 100
                  minimum: 0
                  description: Commission charged to the product
                images:
                  type: array
                  items:
                    type: object
                    properties:
                      image:
                        type: object
                        description: Image object with original and thumbnail
                        properties:
                          thumbnail:
                            type: string
                          original:
                            type: string
                        required:
                        - thumbnail
                        - original
                        name: image
                      isDefault:
                        type: boolean
                        description: If the image is the default product's image
                    required:
                    - image
                    - isDefault
                tags:
                  type: array
                  items:
                    type: string
                  description: Tags to find the product
              required:
              - name
              - timeToPrepare
              - price
              - description
              - category
              - _id
              - commission
              - images
  /business/editProductDetail:
    put:
      summary: Edit the details of a product
      operationId: putBusinessEditproductdetail
      parameters:
      - description: en/ar
        name: content-language
        in: header
        required: true
        schema:
          type: string
      tags:
      - Business
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                detailID:
                  type: string
                  maxLength: 24
                  minLength: 24
                  description: ID of the product detail
                type:
                  type: string
                  enum:
                  - SIMPLE
                  - MULTIPLE
                  - TEXT
                  description: 'Type of detail: SIMPLE | MULTIPLE | TEXT'
                default:
                  type: string
                  description: ID of the option that is selected as default
                isObligatory:
                  type: boolean
                  description: Indicates if the detail is obligatory
                options:
                  type: array
                  items:
                    type: string
                  description: Options to show to the customer
                text:
                  type: string
                  description: Description of the detail
              required:
              - detailID
              - type
              - isObligatory
  /business/goOnOffDuty:
    put:
      summary: Go on or off duty
      operationId: putBusinessGoonoffduty
      parameters:
      - description: Bearer Token
        name: authorization
        in: header
        required: true
        schema:
          type: string
      - description: en/ar
        name: content-language
        in: header
        required: true
        schema:
          type: string
      tags:
      - Business
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                onDutyFlag:
                  type: boolean
                  description: New value of onDutyFlag
              required:
              - onDutyFlag
  /business/setNewPassword:
    put:
      summary: Set New Password
      operationId: putBusinessSetnewpassword
      tags:
      - Business
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                mobile:
                  type: string
                  description: Phone number that is being verified
                password:
                  type: string
                  minLength: 6
                  description: password must contains minimum 6 character
              required:
              - mobile
              - password
  /business/updateProductCategory:
    put:
      summary: Update a product category
      operationId: putBusinessUpdateproductcategory
      parameters:
      - description: Bearer Token
        name: authorization
        in: header
        required: true
        schema:
          type: string
      - description: en/ar
        name: content-language
        in: header
        required: true
        schema:
          type: string
      tags:
      - Business
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                _id:
                  type: string
                  maxLength: 24
                  minLength: 24
                  description: ID of the product category
              required:
              - name
              - _id
  /admin/restartSearch:
    post:
      summary: Restart driver search of selected booking
      operationId: postAdminRestartsearch
      parameters:
      - description: Bearer Token
        name: authorization
        in: header
        required: true
        schema:
          type: string
      - description: en/ar
        name: content-language
        in: header
        required: true
        schema:
          type: string
      tags:
      - Business
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                bookingID:
                  type: string
                  maxLength: 24
                  minLength: 24
                preSelectedProviders:
                  type: array
                  items:
                    type: string
                tip:
                  type: number
                cancelOnlySelectedProviders:
                  type: boolean
                isAdmin:
                  type: boolean
                isBusiness:
                  type: boolean
              required:
              - bookingID
  /api/validateApiPickup:
    post:
      operationId: postApiValidateapipickup
      parameters:
      - description: Bearer Token
        name: authorization
        in: header
        required: true
        schema:
          type: string
      - description: en/ar
        name: content-language
        in: header
        required: true
        schema:
          type: string
      tags:
      - Business
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model_60'
      summary: Post api validateapipickup
      x-summary-source: derived
  /business/addBusiness:
    post:
      summary: Register a new business via Email
      operationId: postBusinessAddbusiness
      parameters:
      - description: en/ar
        name: content-language
        in: header
        required: true
        schema:
          type: string
      tags:
      - Business
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                deviceType:
                  type: string
                  enum:
                  - WEB
                  - ANDROID
                  - IOS
                deviceToken:
                  type: string
                mobile:
                  type: string
                  minLength: 5
                  pattern: /^[0-9]+$/
                countryCode:
                  type: string
                  description: '+593'
                companyName:
                  type: string
                  minLength: 2
                imageLogo:
                  type: object
                  description: image url
                imageFront:
                  type: object
                  description: image url
                fullAddress:
                  type: string
                  minLength: 2
                addressReference:
                  type: string
                exterior:
                  type: string
                interior:
                  type: string
                zipCode:
                  type: string
                country:
                  type: string
                city:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
                businessCategories:
                  type: array
                  items:
                    type: string
                  maxItems: 3
                  description: Categories that the business is part of. Just the ID
                schedule:
                  type: array
                  items:
                    type: object
                    properties:
                      day:
                        type: number
                        minimum: 0
                        maximum: 6
                      open:
                        type: string
                      close:
                        type: string
                      isOpen:
                        type: boolean
                    required:
                    - day
                    - isOpen
                    optional:
                    - open
                    - close
                tags:
                  type: array
                  items:
                    type: string
                  description: Tags to find the business
              required:
              - email
              - deviceType
              - mobile
              - countryCode
              - companyName
              - fullAddress
  /business/addProductDetail:
    post:
      summary: Add a new detail to a product
      operationId: postBusinessAddproductdetail
      parameters:
      - description: en/ar
        name: content-language
        in: header
        required: true
        schema:
          type: string
      tags:
      - Business
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                productID:
                  type: string
                  maxLength: 24
                  minLength: 24
                  description: ID of the product this detail belongs to
                type:
                  type: string
                  enum:
                  - SIMPLE
                  - MULTIPLE
                  - TEXT
                  description: 'Type of detail: SIMPLE | MULTIPLE | TEXT'
                default:
                  type: string
                  description: ID of the option that is selected as default
                isObligatory:
                  type: boolean
                  description: Indicates if the detail is obligatory
                options:
                  type: array
                  items:
                    type: string
                  description: Options to show to the customer
                text:
                  type: string
                  description: Description of the detail
              required:
              - productID
              - type
              - isObligatory
  /business/createBusinessForUser:
    post:
      summary: Create a business for a user and assign to it
      operationId: postBusinessCreatebusinessforuser
      parameters:
      - description: en/ar
        name: content-language
        in: header
        required: true
        schema:
          type: string
      tags:
      - Business
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                country:
                  type: string
                currency:
                  type: string
                options:
                  type: array
                  items:
                    type: string
                  description: Options for business
                storeType:
                  type: string
              required:
              - country
              - currency
              - storeType
  /business/createProduct:
    post:
      summary: Register a new product of a business
      operationId: postBusinessCreateproduct
      parameters:
      - description: en/ar
        name: content-language
        in: header
        required: true
        schema:
          type: string
      tags:
      - Business
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                image:
                  type: object
                  description: image url
                timeToPrepare:
                  type: number
                isActive:
                  type: boolean
                price:
                  type: number
                description:
                  type: string
                categoryID:
                  type: string
                  maxLength: 24
                  minLength: 24
                  description: ID of the category of the product
                details:
                  type: array
                  items:
                    type: string
                productType:
                  type: string
                  description: Type of product. Related to the categories that the business belongs to.
                commission:
                  type: number
                  maximum: 100
                  minimum: 0
                  description: Commission charged to the product
                images:
                  type: array
                  items:
                    type: object
                    properties:
                      image:
                        type: object
                        description: Image object with original and thumbnail
                        properties:
                          thumbnail:
                            type: string
                          original:
                            type: string
                        required:
                        - thumbnail
                        - original
                        name: image
