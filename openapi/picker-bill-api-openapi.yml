openapi: 3.2.0
info:
  title: Picker Production Documentation Bill API
  version: V1.0.0
  contact:
    name: RV
    email: rachit.verma@nextjuggernaut.com
servers:
- url: http://api.pickerexpress.com/
tags:
- name: Bill
paths:
  /billing/getBillDetails:
    get:
      summary: Get details related to the bill
      operationId: getBillingGetbilldetails
      parameters:
      - description: Bearer Token
        name: authorization
        in: header
        required: true
        schema:
          type: string
      - description: en/ar
        name: content-language
        in: header
        required: true
        schema:
          type: string
      - description: ID of the bill to check its details
        name: billID
        in: query
        required: true
        schema:
          type: string
          maxLength: 24
          minLength: 24
      tags:
      - Bill
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
