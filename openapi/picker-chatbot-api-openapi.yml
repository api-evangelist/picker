swagger: '2.0'
info:
  title: Picker Production Documentation accounting chatbot API
  version: V1.0.0
  contact:
    name: RV
    email: rachit.verma@nextjuggernaut.com
host: api.pickerexpress.com
basePath: /
schemes:
- http
tags:
- name: chatbot
paths:
  /api/sendChatbotBookingRate:
    post:
      summary: Rating a booking from chatbot
      operationId: postApiSendchatbotbookingrate
      parameters:
      - type: string
        description: Bearer Token
        name: authorization
        in: header
        required: true
      - type: string
        description: en/ar
        name: content-language
        in: header
        required: true
      - in: body
        name: body
        schema:
          $ref: '#/definitions/Model 59'
      tags:
      - chatbot
      responses:
        default:
          schema:
            type: string
          description: Successful
definitions:
  Model 59:
    type: object
    properties:
      title:
        type: string
      bookingID:
        type: string
      rating:
        type: string
      comment:
        type: string
      workspaceName:
        type: string
      businessName:
        type: string
      customerName:
        type: string
    required:
    - bookingID
    - rating
    - comment
