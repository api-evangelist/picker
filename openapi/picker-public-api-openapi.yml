openapi: 3.2.0
info:
  title: Picker Production Documentation Public API
  version: V1.0.0
  contact:
    name: RV
    email: rachit.verma@nextjuggernaut.com
servers:
- url: http://api.pickerexpress.com/
tags:
- name: Public
paths:
  /public/reports:
    get:
      summary: Get Past Booking For Business public
      operationId: getPublicReports
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: startDate
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: token
        in: query
        required: true
        schema:
          type: string
      tags:
      - Public
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
