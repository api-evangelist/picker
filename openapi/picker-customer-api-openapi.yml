definitions:
  locationDetails:
    type: object
    description: It is an object having different keys
    properties:
      latitude:
        type: number
        minimum: -90
        maximum: 90
      longitude:
        type: number
        minimum: -180
        maximum: 180
      addressLine1:
        type: string
        x-convert:
          trim: true
      addressLine2:
        type: string
        x-convert:
          trim: true
      city:
        type: string
        x-convert:
          uppercase: true
          trim: true
      state:
        type: string
        x-convert:
          uppercase: true
          trim: true
      country:
        type: string
        x-convert:
          uppercase: true
          trim: true
      zipCode:
        type: string
        x-convert:
          trim: true
    required:
    - latitude
    - longitude
    - addressLine1
    - city
    - state
    - zipCode
  Model 71:
    type: object
    properties:
      bookingID:
        type: string
        minLength: 24
        maxLength: 24
      query:
        type: string
      role:
        type: string
        description: role of user
        enum:
        - customer
        - driver
    required:
    - role
  Model 35:
    type: object
    properties:
      bookingID:
        type: string
        minLength: 24
        maxLength: 24
      orderReceived:
        type: boolean
        default: false
    required:
    - bookingID
    - orderReceived
  Model 46:
    type: object
    properties:
      locationId:
        type: string
        description: required if location id update
        minLength: 24
        maxLength: 24
      companyName:
        type: string
        minLength: 2
        pattern: /^[a-zA-Z ]+$/
        x-convert:
          trim: true
      companyAddress:
        type: string
        minLength: 2
        x-convert:
          trim: true
      city:
        type: string
        minLength: 2
        x-convert:
          trim: true
      state:
        type: string
        minLength: 2
        x-convert:
          trim: true
      zipCode:
        type: string
        minLength: 2
        x-convert:
          trim: true
      addressType:
        type: string
        description: '  DELIVERY PICKUP'
        enum:
        - DELIVERY
        - PICKUP
      type:
        type: string
        description: ' HOME OFFICE'
        enum:
        - HOME
        - OFFICE
      latitude:
        type: number
      longitude:
        type: number
    required:
    - addressType
    - latitude
    - longitude
  Model 34:
    type: object
    properties:
      locationDetails:
        $ref: '#/definitions/locationDetails'
    required:
    - locationDetails
