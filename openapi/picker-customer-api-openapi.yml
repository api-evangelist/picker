        required: true
      - type: string
        minLength: 3
        x-convert:
          trim: true
        name: monthlyDeliveries
        in: formData
        required: true
      - type: string
        minLength: 3
        x-convert:
          trim: true
        name: employeesCompany
        in: formData
        required: true
      consumes:
      - application/x-www-form-urlencoded
      tags:
      - customer
      responses:
        default:
          schema:
            type: string
          description: Successful
  /customer/service/location:
    post:
      summary: Customer can add his favourite service location
      operationId: postCustomerServiceLocation
      parameters:
      - type: string
        description: Bearer Token
        name: authorization
        in: header
        required: true
      - type: string
        description: en/ar
        name: content-language
        in: header
        required: true
      - type: string
        x-convert:
          trim: true
        name: placeID
        in: formData
      - type: string
        x-convert:
          trim: true
        name: title
        in: formData
      - type: string
        x-convert:
          trim: true
        name: fullAddress
        in: formData
      - type: string
        minLength: 2
        pattern: /^[a-zA-Z ]+$/
        x-convert:
          trim: true
        name: companyName
        in: formData
      - type: string
        minLength: 2
        x-convert:
          trim: true
        name: companyAddress
        in: formData
      - type: string
        minLength: 2
        x-convert:
          trim: true
        name: city
        in: formData
      - type: string
        minLength: 2
        x-convert:
          trim: true
        name: state
        in: formData
      - type: string
        minLength: 2
        x-convert:
          trim: true
        name: zipCode
        in: formData
      - type: string
        description: ' DELIVERY PICKUP '
        enum:
        - DELIVERY
        - PICKUP
        name: addressType
        in: formData
        required: true
      - type: string
        description: ' HOME OFFICE OTHERS'
        enum:
        - HOME
        - OFFICE
        - OTHERS
        name: type
        in: formData
        required: false
      - type: number
        name: latitude
        in: formData
        required: false
      - type: number
        name: longitude
        in: formData
        required: false
      consumes:
