openapi: 3.2.0
info:
  title: Picker Production Documentation Duty API
  version: V1.0.0
  contact:
    name: RV
    email: rachit.verma@nextjuggernaut.com
servers:
- url: http://api.pickerexpress.com/
tags:
- name: Duty
paths:
  /driver/duty:
    put:
      summary: Driver Update on duty off duty
      operationId: putDriverDuty
      parameters:
      - description: Bearer Token
        name: authorization
        in: header
        required: true
        schema:
          type: string
      - description: en/ar
        name: content-language
        in: header
        required: true
        schema:
          type: string
      - description: go online and offline duty
        name: onDutyFlag
        in: query
        required: true
        schema:
          type: boolean
      tags:
      - Duty
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
