openapi: 3.2.0
info:
  title: Picker Production Documentation Driver API
  version: V1.0.0
  contact:
    name: RV
    email: rachit.verma@nextjuggernaut.com
servers:
- url: http://api.pickerexpress.com/
tags:
- name: Driver
paths:
  /driver/getAllAvailableDriver:
    get:
      summary: Returns a list of drivers that match the criteria selected
      operationId: getDriverGetallavailabledriver
      parameters:
      - description: Bearer Token
        name: authorization
        in: header
        required: true
        schema:
          type: string
      - description: en/ar
        name: content-language
        in: header
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: number
      - name: skip
        in: query
        required: false
        schema:
          type: number
      - name: regionID
        in: query
        required: false
        schema:
          type: string
          maxLength: 24
          minLength: 24
      - description: User's email or name
        name: searchBooking
        in: query
        required: false
        schema:
          type: string
      - name: searchText
        in: query
        required: false
        schema:
          type: string
      - name: carType
        in: query
        required: true
        schema:
          type: number
          enum:
          - 1
          - 0
      - description: Search for drivers near this latitude
        name: latitude
        in: query
        required: false
        schema:
          type: number
      - description: Search for drivers near this longitude
        name: longitude
        in: query
        required: false
        schema:
          type: number
      - name: minimumDriverCash
        in: query
        required: false
        schema:
          type: number
          minimum: 0
      - name: bookingID
        in: query
        required: false
        schema:
          type: string
      tags:
      - Driver
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
  /driver/getAllAvailableDriverMyFleet:
    get:
      summary: Returns a list of drivers that match the criteria selected
      operationId: getDriverGetallavailabledrivermyfleet
      parameters:
      - description: Bearer Token
