      - description: Search for drivers near this longitude
        name: longitude
        in: query
        required: false
        schema:
          type: number
      - name: minimumDriverCash
        in: query
        required: false
        schema:
          type: number
          minimum: 0
      - name: bookingID
        in: query
        required: false
        schema:
          type: string
      tags:
      - Driver
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
  /driver/getAllDriver:
    get:
      summary: get all Driver
      operationId: getDriverGetalldriver
      parameters:
      - description: Bearer Token
        name: authorization
        in: header
        required: true
        schema:
          type: string
      - description: en/ar
        name: content-language
        in: header
