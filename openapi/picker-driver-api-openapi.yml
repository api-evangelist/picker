        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
  /driver/getDriverBalances:
    get:
      summary: Returns the drivers work balance and total pay
      operationId: getDriverGetdriverbalances
      parameters:
      - description: Bearer Token
        name: authorization
        in: header
        required: true
        schema:
          type: string
      - description: en/ar
        name: content-language
        in: header
        required: true
        schema:
          type: string
      tags:
      - Driver
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
  /driver/getDriverTracking:
    get:
      summary: get all Driver
      operationId: getDriverGetdrivertracking
      parameters:
      - description: Bearer Token
        name: authorization
        in: header
        required: true
        schema:
          type: string
      - description: en/ar
        name: content-language
        in: header
        required: true
        schema:
          type: string
      - name: carType
        in: query
        required: true
        schema:
          type: number
          enum:
          - 1
          - 0
          - 3
      - name: status
        in: query
        required: true
        schema:
          type: number
          enum:
          - 1
          - 2
          - 3
      - name: superRegionID
        in: query
        required: false
        schema:
          type: string
      tags:
      - Driver
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
  /driver/getVehicleDetails:
    get:
      summary: get vehicle details
      operationId: getDriverGetvehicledetails
      parameters:
      - description: Bearer Token
        name: authorization
        in: header
        required: true
        schema:
          type: string
      - description: en/ar
        name: content-language
        in: header
        required: true
        schema:
          type: string
      - name: isDeleted
        in: query
        schema:
          type: boolean
      - description: limit data in response
        name: limit
        in: query
        required: false
        schema:
          type: integer
      - description: limit data from response
        name: skip
        in: query
        required: false
        schema:
          type: integer
      tags:
      - Driver
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
  /driver/listVehicleTypeAndCompany:
    get:
      summary: get vehicle type and company
      operationId: getDriverListvehicletypeandcompany
      parameters:
      - description: Bearer Token
        name: authorization
        in: header
        required: true
        schema:
          type: string
      - description: en/ar
        name: content-language
        in: header
        required: true
        schema:
          type: string
      - name: isDeleted
        in: query
        schema:
          type: boolean
      - description: limit data in response
        name: limit
        in: query
        required: false
        schema:
          type: integer
      - description: limit data from response
        name: skip
        in: query
        required: false
        schema:
          type: integer
      tags:
