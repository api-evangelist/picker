        in: header
        required: true
        schema:
          type: string
      - description: en/ar
        name: content-language
        in: header
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: number
      - name: skip
        in: query
        required: false
        schema:
          type: number
      - name: regionID
        in: query
        required: false
        schema:
          type: string
          maxLength: 24
          minLength: 24
      - description: User's email or name
        name: searchBooking
        in: query
        required: false
        schema:
          type: string
      - name: searchText
        in: query
        required: false
        schema:
          type: string
      - name: carType
        in: query
        required: true
        schema:
          type: number
          enum:
