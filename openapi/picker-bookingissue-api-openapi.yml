swagger: '2.0'
info:
  title: Picker Production Documentation accounting bookingIssue API
  version: V1.0.0
  contact:
    name: RV
    email: rachit.verma@nextjuggernaut.com
host: api.pickerexpress.com
basePath: /
schemes:
- http
tags:
- name: bookingIssue
paths:
  /booking/setBookingIssue:
    put:
      summary: Set issue for a booking
      operationId: putBookingSetbookingissue
      parameters:
      - type: string
        description: Bearer Token
        name: authorization
        in: header
        required: true
      - type: string
        description: en/ar
        name: content-language
        in: header
        required: true
      - in: body
        name: body
        schema:
          $ref: '#/definitions/Model 28'
      tags:
      - bookingIssue
      responses:
        default:
          schema:
            type: string
          description: Successful
definitions:
  Model 28:
    type: object
    properties:
      bookingID:
        type: string
        description: _id of the booking selected
        minLength: 24
        maxLength: 24
      bookingIssuesIds:
        $ref: '#/definitions/bookingIssuesIds'
        type: array
    required:
    - bookingID
    - bookingIssuesIds
  bookingIssuesIds:
    type: array
    description: Array of booking issue ids
    items:
      type: string
      minLength: 24
      maxLength: 24
