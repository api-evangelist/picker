  /admin/getAllUsers:
    get:
      summary: Get List Of All Customers by Role[serviceProvider, customer, driver, business]
      operationId: getAdminGetallusers
      parameters:
      - description: Bearer Token
        name: authorization
        in: header
        required: true
        schema:
          type: string
      - description: en/ar
        name: content-language
        in: header
        required: true
        schema:
          type: string
      - description: role of user order is  customer/driver/serviceProvider/admin/business
        name: role
        in: query
        required: true
        schema:
          type: string
          enum:
          - all
          - customer
          - driver
          - serviceProvider
          - admin
          - business
      - name: isBlocked
        in: query
        required: true
        schema:
          type: string
          enum:
          - all
          - true
          - false
      - name: isDeleted
        in: query
        required: true
        schema:
          type: string
          enum:
          - all
          - true
          - false
      - name: isAdminVerified
        in: query
        required: true
        schema:
          type: string
          enum:
          - all
          - true
          - false
      - description: list only users created by self if true else all
        name: createdBySelf
        in: query
        required: false
        schema:
          type: boolean
      - description: user email or name
        name: searchUser
        in: query
        required: false
        schema:
          type: string
      - description: limit data in response
        name: limit
        in: query
        required: false
        schema:
          type: integer
      - description: limit data from response
        name: skip
        in: query
        required: false
        schema:
          type: integer
      - description: Filter users that belong to this Super Region
        name: superRegionID
        in: query
        required: false
        schema:
          type: string
      tags:
      - Admin
      responses:
