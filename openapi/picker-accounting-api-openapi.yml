swagger: '2.0'
info:
  title: Picker Production Documentation accounting API
  version: V1.0.0
  contact:
    name: RV
    email: rachit.verma@nextjuggernaut.com
host: api.pickerexpress.com
basePath: /
schemes:
- http
tags:
- name: accounting
paths:
  /accounting/refundBalanceTransactions:
    put:
      summary: Registers transaction refund for the selected balance transactions
      operationId: putAccountingRefundbalancetransactions
      parameters:
      - type: string
        description: Bearer Token
        name: authorization
        in: header
        required: true
      - type: string
        description: en/ar
        name: content-language
        in: header
        required: true
      - in: body
        name: body
        schema:
          $ref: '#/definitions/Model 2'
      tags:
      - accounting
      responses:
        default:
          schema:
            type: string
          description: Successful
definitions:
  Model 2:
    type: object
    properties:
      transactions:
        $ref: '#/definitions/transactions'
        type: array
    required:
    - transactions
  transactions:
    type: array
    items:
      type: string
