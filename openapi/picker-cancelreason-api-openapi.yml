openapi: 3.2.0
info:
  title: Picker Production Documentation Cancel Reason API
  version: V1.0.0
  contact:
    name: RV
    email: rachit.verma@nextjuggernaut.com
servers:
- url: http://api.pickerexpress.com/
tags:
- name: cancelReason
paths:
  /admin/getAllCancelReasons:
    get:
      summary: Returns the list of all Cancel Reasons available
      operationId: getAdminGetallcancelreasons
      parameters:
      - description: Bearer Token
        name: authorization
        in: header
        required: true
        schema:
          type: string
      - description: en/ar
        name: content-language
        in: header
        required: true
        schema:
          type: string
      tags:
      - cancelReason
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
