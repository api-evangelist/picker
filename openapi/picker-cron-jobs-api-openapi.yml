openapi: 3.2.0
info:
  title: Picker Production Documentation Cron Jobs API
  version: V1.0.0
  contact:
    name: RV
    email: rachit.verma@nextjuggernaut.com
servers:
- url: http://api.pickerexpress.com/
tags:
- name: Cron Jobs
paths:
  /cronJobs/clearAll:
    post:
      summary: Clear all active cron jobs
      operationId: postCronjobsClearall
      parameters:
      - description: Bearer Token
        name: authorization
        in: header
        required: true
        schema:
          type: string
      - description: en/ar
        name: content-language
        in: header
        required: true
        schema:
          type: string
      tags:
      - Cron Jobs
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
