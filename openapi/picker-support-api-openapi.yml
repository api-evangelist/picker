  /vehicles/pricing:
    get:
      summary: Get List Of All fares support
      operationId: getVehiclesPricing
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: number
      - name: skip
        in: query
        required: false
        schema:
          type: number
      - description: Type of vehicle for the booking
        name: carType
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: number
      - description: region id for the booking
        name: regionID
        in: query
        required: false
        schema:
          type: string
          maxLength: 24
          minLength: 24
      - description: super region id for the booking
        name: superRegionID
        in: query
        required: false
        schema:
          type: string
          maxLength: 24
          minLength: 24
