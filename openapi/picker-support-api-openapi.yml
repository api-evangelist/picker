          content:
            application/json:
              schema:
                type: string
  /admin/support/updateContact:
    put:
      summary: update Contacts support]
      operationId: putAdminSupportUpdatecontact
      parameters:
      - description: Bearer Token
        name: authorization
        in: header
        required: true
        schema:
          type: string
      - description: en/ar
        name: content-language
        in: header
        required: true
        schema:
          type: string
      tags:
      - Support
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model_43'
components:
  schemas:
    phone:
      type: object
      properties:
        countryCode:
          type: string
        phoneNumber:
          type: string
        isAvailable:
          type: boolean
    Model_43:
      type: object
      properties:
        _id:
          type: string
          minLength: 24
          maxLength: 24
          x-convert:
            trim: true
        phone:
          $ref: '#/components/schemas/phone'
        contactMail:
          $ref: '#/components/schemas/contactMail'
        webAddress:
          $ref: '#/components/schemas/webAddress'
        reachUs:
          $ref: '#/components/schemas/webAddress'
        isAvailable:
          type: boolean
      required:
      - _id
    webAddress:
      type: object
      properties:
        address:
          type: string
        isAvailable:
          type: boolean
    contactMail:
      type: object
      properties:
        email:
          type: string
        isAvailable:
          type: boolean
