      - name: limit
        in: query
        required: false
        schema:
          type: number
      - name: skip
        in: query
        required: false
        schema:
          type: number
      - name: carType
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: number
      - name: promoId
        in: query
        schema:
          type: string
          maxLength: 24
          minLength: 24
      - description: region ID is optional
        name: regionID
        in: query
        required: false
        schema:
          type: string
          maxLength: 24
          minLength: 24
      - name: billedDistance
        in: query
