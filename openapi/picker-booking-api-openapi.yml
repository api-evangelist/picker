  /booking/createBooking:
    post:
      summary: Create a new booking
      operationId: postBookingCreatebooking
      parameters:
      - description: Bearer Token
        name: authorization
        in: header
        required: true
        schema:
          type: string
      - description: en/ar
        name: content-language
        in: header
        required: true
        schema:
          type: string
      tags:
      - Booking
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                deliveryCity:
                  type: string
                  maxLength: 50
                  minLength: 3
                deliveryState:
                  type: string
                  default: N/A
                  maxLength: 50
                  minLength: 3
                deliveryZipCode:
                  type: string
                  default: N/A
                  maxLength: 20
                deliveryAddress:
                  type: string
                  minLength: 2
                deliveryLongitude:
                  type: number
                  maximum: 180
                  minimum: -180
                deliveryLatitude:
                  type: number
                  maximum: 90
                  minimum: -90
                deliveryReferences:
                  type: string
                saveDeliveryAddress:
                  type: boolean
                  default: false
                pickupLongitude:
                  type: number
                  maximum: 180
                  minimum: -180
                pickupLatitude:
                  type: number
                  maximum: 90
                  minimum: -90
                pickupCity:
                  type: string
                  maxLength: 50
                  minLength: 3
                pickupState:
                  type: string
                  default: N/A
                  maxLength: 50
                  minLength: 3
                pickupZipCode:
                  type: string
                  default: N/A
                  maxLength: 20
                pickupAddress:
                  type: string
                  minLength: 2
                pickupReferences:
                  type: string
                savePickupAddress:
                  type: boolean
                  default: false
                pickupDateTimeFrom:
                  type: string
                  default: '2026-07-13T16:15:38.356Z'
                bookingNotes:
                  type: string
                isLaterBooking:
                  type: boolean
                  default: false
                carType:
                  type: number
                  description: 'Type of vehicle for this booking. Bike: 1, Lite: 0'
                carName:
                  type: string
                  enum:
                  - BIKE
                  - LITE
                  description: Type of vehicle for this booking
                paymentMethod:
                  type: string
                  enum:
                  - CARD
                  - CASH
                  description: Payment method for the booking. CARD or CASH
                bookingType:
                  type: number
                  enum:
                  - 0
                  - 1
                promoAliasID:
                  type: string
                  maxLength: 24
                  minLength: 24
                  description: Promo to be used for this booking
                regionID:
                  type: string
                  maxLength: 24
                  minLength: 24
                  description: Region this booking belongs to
                billedDistance:
                  type: number
                  minimum: 0
                  description: Total distance from pickup to delivery location
                oneSignalId:
                  type: string
                  description: Customer's id from oneSignal
                realPhone:
                  type: string
                realPositionLatitude:
                  type: number
                  maximum: 180
                  minimum: -180
                realPositionLongitude:
                  type: number
                  maximum: 180
                  minimum: -180
                minimumDriverCash:
                  type: number
                  maximum: 200
                  minimum: 0
                  description: Minimum amount the driver has to have to accept this booking
                productReferencesImages:
                  type: array
                  items:
                    type: object
                    properties:
                      original:
                        type: string
                      thumbnail:
                        type: string
                    optional:
                    - original
                    - thumbnail
                  description: Image reference array for products
                subtype:
                  type: string
                  enum:
                  - SHOP
                  - PICKUP
                  - DELIVER
                  - BUSINESS_SHOP
                  - BUSINESS_DELIVER
                  - PICKUP_AND_DELIVER
                contact:
                  type: object
                  description: Information for the booking's contact
                tipBusiness:
                  type: number
                  minimum: 0
                  description: Tip for the driver
              required:
              - deliveryCity
              - deliveryAddress
              - deliveryLongitude
              - deliveryLatitude
              - pickupLongitude
              - pickupLatitude
              - pickupCity
              - pickupAddress
              - carType
              - carName
              - paymentMethod
              - bookingType
              - billedDistance
  /booking/createMarketPlaceBooking:
    post:
      summary: Create Booking Request for Market Place
      operationId: postBookingCreatemarketplacebooking
      parameters:
      - description: Bearer Token
        name: authorization
        in: header
        required: true
        schema:
          type: string
      - description: en/ar
        name: content-language
        in: header
        required: true
        schema:
          type: string
      tags:
      - Booking
      responses:
        default:
          description: Successful
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                businessID:
                  type: string
                  description: ID of the business the order is for
                products:
                  type: array
                  items:
                    type: object
                    properties:
                      productID:
                        type: string
                        description: ID of the product selected
                      quantity:
                        type: number
                        description: Amount of that product selected
                      details:
                        type: array
                        description: Array of the details the user selected for this product
                        items:
                          type: object
                          properties:
                            _id:
                              type: string
                              description: ID of the product detail selected
                            options:
                              type: array
                              description: Array of options selected for this product detail
                              items:
                                type: string
                              collectionFormat: multi
                              name: options
                            text:
                              type: string
                              description: Product-detail text shown to the user
                            additionalInformation:
                              type: string
                              description: Additional information for the product
                          required:
                          - _id
                          optional:
                          - options
                          - text
                          - additionalInformation
                        collectionFormat: multi
                        name: details
                    required:
                    - productID
                    - quantity
                    optional:
                    - details
                  description: Array of the products selected for the order
                productReferencesImages:
                  type: array
                  items:
                    type: object
                    properties:
                      original:
                        type: string
                      thumbnail:
                        type: string
                    optional:
                    - original
                    - thumbnail
                  description: Image reference array for products
                pickupDateTimeFrom:
                  type: string
                  default: '2026-07-13T16:15:38.360Z'
                deliveryCity:
                  type: string
                  default: N/A
                  maxLength: 50
                  minLength: 3
                deliveryState:
                  type: string
                  default: N/A
                  maxLength: 50
                  minLength: 3
                deliveryZipCode:
                  type: string
                  default: N/A
                  maxLength: 20
                  pattern: /^[a-zA-Z0-9 ]+$/
                deliveryAddress:
                  type: string
                  minLength: 2
                deliveryLongitude:
                  type: number
                  maximum: 180
                  minimum: -180
