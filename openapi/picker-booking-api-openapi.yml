        in: query
        required: false
        schema:
          type: string
      - name: sortOrder
        in: query
        required: false
        schema:
          type: string
      - name: searchBooking
        in: query
        required: false
        schema:
          type: string
      - name: customer
        in: query
        required: false
        schema:
          type: string
      - name: driver
        in: query
        required: false
        schema:
          type: string
      - name: business
        in: query
        required: false
        schema:
          type: string
